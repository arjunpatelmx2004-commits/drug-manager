<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت دارو</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Vazirmatn',sans-serif;
}
</style>

</head>

<body class="bg-slate-100">

<div class="max-w-md mx-auto min-h-screen bg-slate-100 pb-24">

    <!-- Header -->

    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 rounded-b-[35px] shadow-lg">

        <div class="flex justify-between items-center text-white">

            <div>
                <p class="opacity-80 text-sm">
                    خوش آمدید
                </p>

                <h1 class="text-2xl font-bold">
                    پنل مدیریت دارو
                </h1>
            </div>

            <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center text-2xl">
                💊
            </div>

        </div>

        <div class="mt-6">

            <input
            type="text"
            placeholder="جستجوی بیمار..."
            class="w-full rounded-2xl p-4 outline-none text-black">

        </div>

    </div>

    <!-- Stats -->

    <div class="grid grid-cols-3 gap-3 px-4 -mt-6">

        <div class="bg-white rounded-3xl p-4 shadow">
            <div class="text-blue-600 text-2xl font-bold">
                532
            </div>

            <div class="text-xs text-gray-500">
                بیمار
            </div>
        </div>

        <div class="bg-white rounded-3xl p-4 shadow">
            <div class="text-green-600 text-2xl font-bold">
                42
            </div>

            <div class="text-xs text-gray-500">
                دارو
            </div>
        </div>

        <div class="bg-white rounded-3xl p-4 shadow">
            <div class="text-orange-500 text-2xl font-bold">
                98%
            </div>

            <div class="text-xs text-gray-500">
                موجودی
            </div>
        </div>

    </div>

    <!-- Daily Report -->

    <div class="px-4 mt-6">

        <div class="flex justify-between mb-3">

            <h2 class="font-bold text-lg">
                مصرف امروز
            </h2>

            <span class="text-indigo-600 text-sm">
                مشاهده همه
            </span>

        </div>

        <div class="space-y-3">

            <div class="bg-white p-4 rounded-3xl shadow">

                <div class="flex justify-between">

                    <div>
                        <h3 class="font-bold">
                            فلوکستین
                        </h3>

                        <p class="text-sm text-gray-500">
                            مصرف روزانه
                        </p>
                    </div>

                    <div class="text-right">

                        <div class="text-xl font-bold text-indigo-600">
                            420
                        </div>

                        <div class="text-xs text-gray-500">
                            عدد
                        </div>

                    </div>

                </div>

            </div>

            <div class="bg-white p-4 rounded-3xl shadow">

                <div class="flex justify-between">

                    <div>
                        <h3 class="font-bold">
                            کلومیپرامین
                        </h3>

                        <p class="text-sm text-gray-500">
                            مصرف روزانه
                        </p>
                    </div>

                    <div>

                        <div class="text-xl font-bold text-green-600">
                            310
                        </div>

                        <div class="text-xs text-gray-500">
                            عدد
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Patients -->

    <div class="px-4 mt-6">

        <div class="flex justify-between mb-3">

            <h2 class="font-bold text-lg">
                بیماران اخیر
            </h2>

            <span class="text-indigo-600 text-sm">
                همه
            </span>

        </div>

        <div class="space-y-3">

            <div class="bg-white p-4 rounded-3xl shadow">

                <div class="flex justify-between items-center">

                    <div>

                        <h3 class="font-bold">
                            علی رضایی
                        </h3>

                        <p class="text-sm text-gray-500">
                            3 دارو ثبت شده
                        </p>

                    </div>

                    <button class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl">
                        پروفایل
                    </button>

                </div>

            </div>

            <div class="bg-white p-4 rounded-3xl shadow">

                <div class="flex justify-between items-center">

                    <div>

                        <h3 class="font-bold">
                            محمد احمدی
                        </h3>

                        <p class="text-sm text-gray-500">
                            5 دارو ثبت شده
                        </p>

                    </div>

                    <button class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl">
                        پروفایل
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Add Button -->

    <button class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-indigo-600 w-16 h-16 rounded-full text-white text-3xl shadow-2xl">
        +
    </button>

    <!-- Bottom Navigation -->

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t h-20 flex justify-around items-center">

        <div class="text-center">
            <div class="text-xl">🏠</div>
            <div class="text-xs">خانه</div>
        </div>

        <div class="text-center">
            <div class="text-xl">👥</div>
            <div class="text-xs">بیماران</div>
        </div>

        <div class="text-center">
            <div class="text-xl">💊</div>
            <div class="text-xs">داروها</div>
        </div>

        <div class="text-center">
            <div class="text-xl">📊</div>
            <div class="text-xs">گزارش</div>
        </div>

    </div>

</div>

</body>
</html>
